[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/"
]

# v4-template disables this in its own foundry.toml too: its BaseScript.sol uses a
# bare "test/utils/Deployers.sol" import that the real compiler resolves fine
# (relative to v4-template's own package root) but the lint tool can't.
[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
